apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize-слой для GitOps (ArgoCD / Flux): подключает каноническую базу
# monitoring/rules/loki и добавляет общие Kubernetes-метки.
# Работает со стандартным --load-restrictor=LoadRestrictionsRootOnly
# без дублирования файла правил.
labels:
  - pairs:
      app.kubernetes.io/part-of: balletmaster
      app.kubernetes.io/component: observability

resources:
  - ../../rules/loki
