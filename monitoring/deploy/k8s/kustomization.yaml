apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize-база для GitOps (ArgoCD / Flux): генерирует ConfigMap напрямую
# из единственного источника истины — monitoring/rules/loki/balletmaster-loki-rules.yaml.
labels:
  - pairs:
      app.kubernetes.io/part-of: balletmaster
      app.kubernetes.io/component: observability

configMapGenerator:
  - name: balletmaster-loki-rules
    files:
      - balletmaster-loki-rules.yaml=../../rules/loki/balletmaster-loki-rules.yaml
