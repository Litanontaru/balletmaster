apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Каноническая Kustomize-база: держит configMapGenerator в одной директории
# с balletmaster-loki-rules.yaml, чтобы соблюдать LoadRestrictionsRootOnly
# без копирования файла правил и без ослабления ограничений безопасности.
configMapGenerator:
  - name: balletmaster-loki-rules
    files:
      - balletmaster-loki-rules.yaml
